<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOPUP BAR ⚡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e1d;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:22px}.logo{font-size:26px;font-weight:800;margin:8px 0 28px}.logo span{color:#7c5cff}
.hero,.box{background:#121a31;border:1px solid #293252;border-radius:22px;padding:24px;margin-bottom:20px}
.hero h1{font-size:34px;margin:0 0 8px}.hero p{color:#aeb6d1}
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.game,.product{border:1px solid #303b60;background:#0d1428;color:#fff;border-radius:15px;padding:15px;cursor:pointer}
.game.active,.product.active{border-color:#8a68ff;background:#181f3e}.game{text-align:center}.game i{font-size:30px;display:block;margin-bottom:7px}
label{display:block;color:#aeb6d1;font-size:13px;margin:14px 0 6px}input,select{width:100%;padding:13px;border-radius:11px;border:1px solid #303b60;background:#080d1b;color:white}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.product b{display:block}.product small{color:#aeb6d1}
button.buy{width:100%;border:0;border-radius:12px;padding:15px;background:#7c5cff;color:white;font-weight:700;font-size:16px;margin-top:18px;cursor:pointer}
#msg{margin-top:15px;padding:13px;border-radius:12px;background:#19213b;display:none;line-height:1.6}
@media(max-width:650px){.games{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="wrap">
<div class="logo">TOPUP <span>BAR</span> ⚡</div>
<section class="hero"><h1>Top Up Game Gampang.</h1><p>Prototype v2 dengan backend order. Pembayaran dan pengiriman item belum diaktifkan.</p></section>
<div class="box"><h2>🎮 Pilih Game</h2><div class="games" id="games"></div></div>
<div class="box"><h2 id="title">Mobile Legends</h2>
<label>User ID</label><input id="uid" placeholder="Contoh: 123456789">
<label>Server / Zone ID</label><input id="sid" placeholder="Opsional jika game tidak memerlukannya">
<label>Nominal</label><div class="products" id="products"></div>
<label>Pembayaran</label><select id="payment"><option>QRIS</option><option>DANA</option><option>GoPay</option><option>Transfer Bank</option></select>
<button class="buy" onclick="createOrder()">⚡ Buat Pesanan</button><div id="msg"></div></div>
</div>
<script>
let data={}, game="Mobile Legends", product="";
const icons={"Mobile Legends":"⚔️","Free Fire":"🔥","PUBG Mobile":"🎯","Honor of Kings":"👑"};
async function init(){
 data=await (await fetch("/api/products")).json(); renderGames(); renderProducts();
}
function renderGames(){
 games.innerHTML=Object.keys(data).map(g=>`<button class="game ${g===game?"active":""}" onclick="pickGame('${g}')"><i>${icons[g]}</i><b>${g}</b></button>`).join("");
}
function pickGame(g){game=g;product="";title.textContent=g;renderGames();renderProducts()}
function renderProducts(){
 products.innerHTML=data[game].map((p,i)=>`<button class="product ${(!product&&i===0)||product===p.name?"active":""}" onclick="pickProduct('${p.name}')"><b>${p.name}</b><small>Rp ${p.price.toLocaleString("id-ID")}</small></button>`).join("");
 if(!product) product=data[game][0].name;
}
function pickProduct(p){product=p;renderProducts()}
async function createOrder(){
 msg.style.display="block"; msg.textContent="Memproses...";
 const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
 game,userId:uid.value.trim(),serverId:sid.value.trim(),product,payment:payment.value
 })});
 const d=await r.json();
 if(!r.ok){msg.textContent="⚠️ "+d.error;return}
 msg.innerHTML=`✅ Order dibuat<br><b>${d.order.id}</b><br>${d.order.game} • ${d.order.product}<br>Status: <b>${d.order.status}</b><br><small>${d.message}</small>`;
}
init();
</script></body></html>
